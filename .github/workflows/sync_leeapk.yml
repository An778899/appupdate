name: Auto Upload LeeAPK to XD STORE

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      max_items:
        description: "How many apps/games to upload per run"
        required: false
        default: "5"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright & Requests
        run: |
          pip install requests playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run Auto Uploader
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_ITEMS_PER_RUN: ${{ github.event.inputs.max_items || '5' }}
        run: python scripts/leeapk_sync.py
